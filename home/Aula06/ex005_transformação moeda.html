<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font: normal 20 pt Arial;
        }
    </style>
</head>
<body>
    <script>
        var real = window.prompt('Quantos reais você tem? ')
        document.write(`Você tem ${real.toLocaleString('pt-BR', {style: 'currency', currency: 'BR'})} reais`)
    </script>
</body>
</html>
