<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font: normal 20 pt Arial;
        }
    </style>
</head>
<body>
     

    <script>
        var nome = window.prompt('Qual é o seu nome: ') //faz a pergunta na tela
        document.write(`Olá, <strong>${nome}</strong>! `)
        document.write(`Seu nome tem ${nome.length} letras.<br>`)
        document.write(`E seu nome em letras maiúsculas é ${nome.toUpperCase()}.<br>`)
        document.write(`E o seu nome em letras minúsculas é ${nome.toLowerCase()}.`)

    </script>
</body>
</html>
